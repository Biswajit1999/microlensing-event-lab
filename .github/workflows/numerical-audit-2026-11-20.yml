name: Numerical research audit (20 Nov 2026)
on:
  push:
    branches: [research/2026-11-20-numerical-audit]
  pull_request:
    paths:
      - 'research/**'
      - '.github/workflows/numerical-audit-2026-11-20.yml'
jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m compileall -q research
      - run: python -m unittest discover -s research -p 'test_finite_exposure.py' -v
